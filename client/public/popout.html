<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Houston Mission Control - Popout</title>
    <style>
      body {
        background-color: #0a0a0a;
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- The layout will portal into the body by default, or we can leave it empty -->
    <script>
      // Copier tous les styles (CSS et balises <style>) depuis la fenêtre principale
      if (window.opener) {
        const parentStyles = window.opener.document.querySelectorAll('link[rel="stylesheet"], style');
        parentStyles.forEach((node) => {
          document.head.appendChild(node.cloneNode(true));
        });
        // Copier les classes du body (pour Tailwind et autres globales)
        document.body.className = window.opener.document.body.className;
      }
    </script>
  </body>
</html>
